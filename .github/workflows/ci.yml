name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux libraries
        if: runner.os == 'Linux'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: node node_modules/playwright-core/cli.js install chromium
      - run: npm run lint
      - run: npm test
      - run: npm run benchmark
      - run: npm run test:runtime
      - run: npm run test:adversarial
      - run: npm run test:package
      - run: npm run test:ui
      - run: npm run test:site-base
      - name: Retain verification reports and tested package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ runner.os }}
          path: |
            validation/consumer/latest.json
            validation/adversarial/latest.json
            runtime/evidence/*.json
            benchmarks/latest.json
            .artifacts/release/*.tgz
          retention-days: 14
          include-hidden-files: true

  upstream:
    name: Pinned upstream SDK observation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:external
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-observation
          path: validation/external/noir-sdk-latest.json
          retention-days: 14
